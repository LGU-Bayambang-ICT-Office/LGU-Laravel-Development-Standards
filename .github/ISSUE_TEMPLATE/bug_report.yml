name: "🐛 Bug Report"
description: "Report a defect, error, or unexpected behavior in the package."
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and resolve the problem.
        
        > [!CAUTION]
        > **Never submit security vulnerabilities or citizen personal data (PII) here.**
        > Please follow [SECURITY.md](https://github.com/LGU-Bayambang-ICT-Office/LGU-Laravel-Development-Standards/blob/main/SECURITY.md) for private vulnerability disclosure.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the package is affected?
      options:
        - "EncryptedPii Cast / PII Blind Indexing"
        - "OfficeScope / BelongsToOffice Trait"
        - "AuditActivityObserver / COA Ledger Triggers"
        - "WorkingDaysService / ARTA 3-7-20 Engine"
        - "HasRouteUuid / Dual-Identifier Routing"
        - "LguInstallCommand (php artisan lgu:install)"
        - "LguAuditCommand (php artisan lgu:audit)"
        - "CSP Policies / Security Middleware"
        - "Publishable Stubs / Migrations"
        - "Dev Tools (pint.json / phpstan.neon)"
        - "Other"
    validations:
      required: true

  - type: input
    id: package_version
    attributes:
      label: Package Version
      description: Which version of lgu-laravel-development-standards are you using? (e.g., v1.0.3)
      placeholder: "v1.0.3"
    validations:
      required: true

  - type: dropdown
    id: php_version
    attributes:
      label: PHP Version
      options:
        - "8.2"
        - "8.3"
        - "8.4"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: laravel_version
    attributes:
      label: Laravel Version
      options:
        - "11.x"
        - "12.x"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: database_engine
    attributes:
      label: Database Engine
      options:
        - "MySQL / MariaDB"
        - "PostgreSQL"
        - "SQLite"
        - "SQL Server"
        - "N/A"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions or a minimal code example to reproduce the behavior.
      placeholder: |
        1. Install package with `...`
        2. Publish assets with `...`
        3. Define model using `...`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: error_output
    attributes:
      label: Error Output / Stack Trace
      description: Paste any error messages, terminal logs, or stack traces here.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations & Privacy Safeguards
      options:
        - label: "I have checked existing open and closed issues to ensure this is not a duplicate."
          required: true
        - label: "I confirm this report contains **NO real citizen personal data (PII)**, passwords, live database credentials, or secret keys."
          required: true
        - label: "I confirm this is a bug report and NOT an unpatched security vulnerability."
          required: true
